<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/jl.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iOS device specific settings -->
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Chrome -->
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <title>Jason (Jinsen) Liu</title>

  <!-- Resolve the theme before first paint. ThemeProvider defaults to dark, so
       match that here — otherwise the page flashes light before React mounts,
       and the curtain below would open in the wrong colour. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- The entry curtain is plain HTML/CSS rather than a React component so it
       covers the viewport from the very first paint, before the bundle runs. -->
  <style>
    #curtain {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    #curtain .panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 51%;
      background: #0f172a;
      animation: curtain-part 1.2s cubic-bezier(0.76, 0, 0.24, 1) 1.25s both;
    }

    #curtain .panel-l {
      left: 0;
      --to: -101%;
    }

    #curtain .panel-r {
      right: 0;
      --to: 101%;
    }

    #curtain .mark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fafafa;
      animation: curtain-mark 1.75s ease 0.05s both;
    }

    #curtain .mark svg {
      width: clamp(52px, 9vw, 76px);
      height: auto;
    }

    html.dark #curtain .panel {
      background: #1b2437;
    }

    html.dark #curtain .mark {
      color: #f4f4f5;
    }

    @keyframes curtain-part {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(var(--to));
      }
    }

    @keyframes curtain-mark {
      0% {
        opacity: 0;
        transform: scale(0.94);
      }

      22% {
        opacity: 1;
        transform: scale(1);
      }

      64% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.03);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #curtain {
        display: none;
      }
    }
  </style>
</head>

  </div>
  <div id="root"></div>
  <script>
    (function () {
      var c = document.getElementById('curtain');
      if (!c) return;
      // Marks the entry as spent. --enter-delay drops to 0 afterwards so a
      // client-side route change back to the hero doesn't sit blank for 1.5s.
      var done = function () { document.documentElement.setAttribute('data-entered', ''); };
      var instant = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (instant) { c.remove(); done(); return; }
      setTimeout(function () { c.remove(); }, 2550);
      // Later than the removal, so it can't retime a hero animation mid-flight.
      setTimeout(done, 3100);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
