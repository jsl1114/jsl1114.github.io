<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#888}iframe{display:block;border:0;margin:0 auto}
</style></head><body><iframe id="f" style="width:1440px;height:900px"></iframe><script>
var p=new URLSearchParams(location.search),f=document.getElementById('f');
var cw=p.get('cw'),ch=p.get('ch');
if(cw){f.style.width=cw+'px';f.style.height=(ch||900)+'px';}
try{ if(p.get('theme')) localStorage.setItem('theme',p.get('theme')); }catch(e){}
f.src=p.get('u')||'/';
setTimeout(function(){try{
  var d=f.contentDocument,win=f.contentWindow;
  if(p.get('show')){var s2=d.createElement('style');s2.textContent='section *{opacity:1!important}';d.head.appendChild(s2);}
  var to=p.get('to'); if(to){d.documentElement.style.scrollBehavior='auto';var el=d.getElementById(to);if(el)win.scrollTo(0,el.getBoundingClientRect().top+win.pageYOffset);}
  var sy=p.get('sy'); if(sy){d.documentElement.style.scrollBehavior='auto';win.scrollTo(0,+sy);}
}catch(e){}},2000);
</script></body></html>
